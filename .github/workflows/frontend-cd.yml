name: Frontend CD

on:
  push:
    branches: [ main ]
    paths:
      - 'starter/frontend/**'
      - '.github/workflows/frontend-cd.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./starter/frontend

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./starter/frontend
        file: ./starter/frontend/Dockerfile
        push: true
        tags: |
          ghcr.io/saimohankowshiktalluri/movie-picture-pipeline-frontend:latest
          ghcr.io/saimohankowshiktalluri/movie-picture-pipeline-frontend:${{ github.sha }}

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: us-east-1

    - name: Update Kubeconfig for EKS
      run: aws eks update-kubeconfig --region us-east-1 --name cluster

    - name: Deploy to EKS Cluster
      run: |
        if [ -d "k8s" ]; then
          cd k8s && kubectl apply -k .
        elif [ -d "../frontend/k8s" ]; then
          cd ../frontend/k8s && kubectl apply -k .
        else
          echo "K8s directory not found, skipping deployment."
        fi