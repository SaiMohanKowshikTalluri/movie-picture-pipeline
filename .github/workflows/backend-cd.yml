name: Backend CD

on:
  push:
    branches: [ main ]
    paths:
      - 'starter/backend/**'
      - '.github/workflows/backend-cd.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./starter/backend

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./starter/backend
        file: ./starter/backend/Dockerfile
        push: true
        tags: |
          ghcr.io/saimohankowshiktalluri/movie-picture-pipeline-backend:latest
          ghcr.io/saimohankowshiktalluri/movie-picture-pipeline-backend:${{ github.sha }}

    - name: Validate Kubernetes Manifests
      run: |
        if [ -d "k8s" ]; then
          cd k8s && kubectl kustomize .
        elif [ -d "../backend/k8s" ]; then
          cd ../backend/k8s && kubectl kustomize .
        else
          echo "K8s directory not found, skipping kustomize validation."
        fi