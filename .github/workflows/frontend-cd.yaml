name: Frontend Continuous Deployment

on:
  push:
    branches: [ main ]
    paths:
      - 'starter/frontend/**'
      - '.github/workflows/frontend-cd.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./starter/frontend
        file: ./starter/frontend/Dockerfile
        push: true
        build-args: |
          REACT_APP_MOVIE_API_URL=http://a4604fa2070444ace825a73b1a3368a2-2070895866.us-east-1.elb.amazonaws.com
        tags: |
          ghcr.io/saimohankowshiktalluri/movie-picture-pipeline-frontend:latest
          ghcr.io/saimohankowshiktalluri/movie-picture-pipeline-frontend:${{ github.sha }}

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: us-east-1

    - name: Update Kubeconfig for EKS
      run: aws eks update-kubeconfig --region us-east-1 --name cluster

    - name: Deploy to EKS Cluster
      run: |
        cd starter/frontend/k8s && kubectl apply -k . || kubectl apply -f .